# /etc/nginx/sites-available/qr-chat  ->  symlink into sites-enabled
# Cloudflare(orange proxy)가 edge TLS를 처리하므로 origin은 평문 :80로 시작해도 된다.
# (ponytail: 필요 시 Cloudflare Origin Cert로 :443 승급)
server {
    listen 80;
    server_name qr-poll.physical-spark.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # SSE: 버퍼링 끄고 오래 유지
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Connection "";
    }
}
