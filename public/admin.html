<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Poll · Presenter Console</title>
  <link rel="stylesheet" href="/style.css?v=12" />
</head>
<body>
  <div class="wrap admin">
    <header>
      <h1 id="title">…</h1>
      <div class="code">Presenter console · code <b id="code"></b>
        · <a id="present" target="_blank" rel="noopener">🖥️ Open projector</a>
        · <a id="joinlink" target="_blank" rel="noopener">Audience link</a>
      </div>
      <p id="warn" class="err"></p>
    </header>

    <div class="admin-layout">
      <aside class="admin-sidebar" aria-label="Presenter navigation">
        <div class="sidebar-label">Views</div>
        <button id="pollsTab" class="admin-tab active" type="button">Polls</button>
        <button id="chatTab" class="admin-tab" type="button" aria-label="Open chat room">Chat Room <span id="chatBadge" class="unread-label" hidden></span></button>
        <div class="sidebar-label">Show on screen</div>
        <div id="sidebarItems" class="sidebar-items"></div>
      </aside>

      <main class="admin-content">
        <section id="pollsPanel" class="panel">
          <div class="panel-title">Polls</div>
          <form id="pollform" class="pollform">
            <input id="pollq" placeholder="Question" required />
            <select id="polltype"><option value="choice">Multiple choice</option><option value="text">Open text</option></select>
            <input id="polloptions" placeholder="Options, separated by commas" />
            <button type="submit">Add poll</button>
          </form>
          <div id="polls"></div>
        </section>

        <section id="chatPanel" class="panel" hidden>
          <div class="panel-title">Chat Room <span id="mcount" class="count"></span><button id="archiveToggle" class="mini" type="button">Show archived</button></div>
          <ul id="feed" class="adminfeed"></ul>
        </section>

        <div class="export-bar"><a id="exportBtn" href="#" title="Download poll results and chat as a text file">⬇ Export results (.txt)</a></div>
      </main>
    </div>
  </div>

  <script type="module">
    import { connect, renderPoll, updatePoll, sortMessages, adminAction } from "/app.js?v=12";
    const parts = location.pathname.split("/");
    const code = parts.pop();
    const key = new URLSearchParams(location.search).get("key") || "";

    document.getElementById("code").textContent = code;
    document.getElementById("present").href = `/present/${code}`;
    document.getElementById("joinlink").href = `/r/${code}`;
    if (!key) document.getElementById("warn").textContent =
      "⚠️ The admin key is missing from this URL. Controls will be disabled.";

    const feed = document.getElementById("feed");
    const pollsPanel = document.getElementById("pollsPanel");
    const chatPanel = document.getElementById("chatPanel");
    const chatTab = document.getElementById("chatTab");
    const chatBadge = document.getElementById("chatBadge");
    const sidebarItems = document.getElementById("sidebarItems");
    const adminChatReadKey = `qr-poll:admin-chat-read:${code}`;
    const pollsEl = document.getElementById("polls");
    const msgs = new Map();
    const polls = new Map();
    let pollOrder = [];        // poll id 순서
    let stage = { focus: "qa", sort: "recent" };
    let chatView = false;
    let unreadChat = 0;
    let showArchived = false;

    function setView(chat) {
      chatView = chat;
      pollsPanel.hidden = chat;
      chatPanel.hidden = !chat;
      document.getElementById("pollsTab").classList.toggle("active", !chat);
      chatTab.classList.toggle("active", chat);
      if (chat) {
        unreadChat = 0;
        chatBadge.hidden = true;
        localStorage.setItem(adminChatReadKey, String(Date.now()));
      }
      renderMessages();
    }

    document.getElementById("pollsTab").onclick = () => setView(false);
    chatTab.onclick = () => setView(true);
    document.getElementById("archiveToggle").onclick = () => {
      showArchived = !showArchived;
      document.getElementById("archiveToggle").textContent = showArchived ? "Back to active" : "Show archived";
      renderMessages();
    };
    // 딥링크: ?view=chat&archived=1 로 특정 뷰를 바로 열 수 있게 (북마크·캡처용). ?blur=1 은 메시지 본문 블러(개인정보 스크린샷용).
    { const q = new URLSearchParams(location.search);
      if (q.get("view") === "chat") setView(true);
      if (q.get("archived") === "1") { showArchived = true; document.getElementById("archiveToggle").textContent = "Back to active"; }
      if (q.get("blur") === "1") { const s = document.createElement("style"); s.textContent = ".adminfeed .txt{filter:blur(7px)}"; document.head.appendChild(s); }
    }

    const stages = () => [...pollOrder];
    const label = (f) => polls.get(f)?.q || f;

    function renderSidebar() {
      sidebarItems.replaceChildren(...stages().map((f) => {
        const row = document.createElement("div");
        row.className = "sidebar-item" + (f === stage.focus ? " active" : "");
        const name = document.createElement("span");
        name.className = "sidebar-item-label";
        name.textContent = label(f);
        name.title = polls.get(f)?.q || f;
        const play = document.createElement("button");
        const isPlaying = f === stage.focus;
        play.type = "button"; play.className = "mini play"; play.textContent = isPlaying ? "■" : "▶";
        play.title = isPlaying ? "Stop showing this poll" : "Show on audience and projector";
        play.setAttribute("aria-label", isPlaying ? `Stop showing ${name.title}` : `Show ${name.title} on audience and projector`);
        play.onclick = () => { setView(false); setStage(isPlaying ? "qa" : f); };
        row.append(name, play);
        return row;
      }));
    }

    async function setStage(focus, sort = (focus === "qa" ? stage.sort : (polls.get(focus)?.sort || "recent"))) {
      if (!key) return;
      const r = await adminAction(code, key, "stage", { focus, sort });
      if (!r) document.getElementById("warn").textContent = "The admin key is invalid.";
      // 서버가 SSE로 stage를 되쏘므로 별도 렌더 불필요
    }

    function renderStageBar() {
      renderSidebar();
    }

    function msgRow(m) {
      const li = document.createElement("li");
      li.dataset.id = m.id;
      if (m.pinned) li.classList.add("pinned");
      const txt = document.createElement("span");
      txt.className = "txt";
      txt.textContent = m.text;
      const meta = document.createElement("span");
      meta.className = "rowmeta";
      const cnt = document.createElement("span"); cnt.className = "cnt"; cnt.textContent = `👍 ${m.reactions || 0}`;
      const pin = document.createElement("button"); pin.type = "button"; pin.className = "mini";
      pin.textContent = m.pinned ? "Unpin" : "Pin";
      pin.onclick = () => adminAction(code, key, `pin/${m.id}`, { on: !m.pinned });
      const del = document.createElement("button"); del.type = "button"; del.className = "mini danger";
      del.textContent = m.deleted ? "Restore" : "Archive";
      del.onclick = () => adminAction(code, key, `${m.deleted ? "restore" : "archive"}/${m.id}`);
      meta.append(cnt, pin, del);
      li.append(txt, meta);
      return li;
    }

    function renderMessages() {
      const pollId = chatView ? "qa" : stage.focus;
      const arr = sortMessages([...msgs.values()].filter((m) => (m.pollId || "qa") === pollId && !!m.deleted === showArchived), stage.sort);
      feed.replaceChildren(...arr.map(msgRow));
      document.getElementById("mcount").textContent = `(${arr.length})`;
    }

    // 인라인 poll 편집 (prompt() 다이얼로그는 브라우저가 차단하면 아무 반응이 없어 폼으로 대체)
    let editingPoll = null;

    function pollEditor(p) {
      const form = document.createElement("form");
      form.className = "polledit";
      const q = document.createElement("input");
      q.className = "pe-q"; q.value = p.q; q.placeholder = "Question"; q.required = true;
      form.append(q);
      let opts = null;
      if (p.type === "choice") {
        opts = document.createElement("input");
        opts.className = "pe-o"; opts.value = (p.options || []).join(", ");
        opts.placeholder = "Options, separated by commas";
        form.append(opts);
      }
      const row = document.createElement("div"); row.className = "pe-row";
      const save = document.createElement("button"); save.type = "submit"; save.className = "mini primary"; save.textContent = "Save";
      const cancel = document.createElement("button"); cancel.type = "button"; cancel.className = "mini"; cancel.textContent = "Cancel";
      const err = document.createElement("span"); err.className = "pe-err";
      cancel.onclick = () => { editingPoll = null; renderPolls(); };
      row.append(save, cancel, err); form.append(row);
      form.onsubmit = async (e) => {
        e.preventDefault();
        const body = {
          id: p.id, type: p.type, q: q.value.trim(),
          options: opts ? opts.value.split(",").map((x) => x.trim()).filter(Boolean) : [],
        };
        if (!body.q) { err.textContent = "질문을 입력하세요."; return; }
        if (p.type === "choice" && body.options.length < 2) { err.textContent = "옵션은 2개 이상."; return; }
        save.disabled = true; err.textContent = "";
        const r = await adminAction(code, key, `poll/${p.id}/update`, body);
        save.disabled = false;
        if (!r) { err.textContent = "저장 실패 — 관리자 키를 확인하세요."; return; }
        editingPoll = null;
        polls.set(p.id, { ...polls.get(p.id), q: body.q, options: body.options });
        renderPolls();
      };
      setTimeout(() => q.focus(), 0);
      return form;
    }

    function renderPolls() {
      pollsEl.replaceChildren(...pollOrder.map((id) => {
        const p = polls.get(id);
        const box = document.createElement("div");
        box.className = "pollwrap";
        if (editingPoll === id) { box.append(pollEditor(p)); return box; }
        box.append(renderPoll(code, p, false));
        const controls = document.createElement("div"); controls.className = "poll-controls";
        for (const [direction, text] of [["up", "▲"], ["down", "▼"]]) {
          const move = document.createElement("button"); move.type = "button"; move.className = "mini"; move.textContent = text;
          move.title = direction === "up" ? "Move up" : "Move down";
          move.onclick = async () => { await adminAction(code, key, `poll/${id}/move/${direction}`); };
          controls.append(move);
        }
        const edit = document.createElement("button"); edit.type = "button"; edit.className = "mini"; edit.textContent = "Edit";
        edit.onclick = () => { editingPoll = id; renderPolls(); };
        const del = document.createElement("button"); del.type = "button"; del.className = "mini danger"; del.textContent = "Delete";
        del.onclick = async () => { if (confirm("Delete this poll?")) await adminAction(code, key, `poll/${id}/delete`); };
        controls.append(edit, del); box.append(controls);
        return box;
      }));
    }

    document.getElementById("pollform").onsubmit = async (e) => {
      e.preventDefault();
      const type = document.getElementById("polltype").value;
      const options = document.getElementById("polloptions").value.split(",").map((x) => x.trim()).filter(Boolean);
      await adminAction(code, key, "poll/create", { type, q: document.getElementById("pollq").value.trim(), options });
      e.target.reset();
    };

    connect(code, {
      onMeta: (d) => {
        document.getElementById("title").textContent = d.title;
        pollOrder = (d.polls || []).map((p) => (polls.set(p.id, p), p.id));
        if (d.stage) stage = d.stage;
        renderStageBar(); renderPolls(); renderMessages();
      },
      onMsg: (m) => {
        msgs.set(m.id, { reactions: 0, pinned: false, ...m }); renderMessages();
        const lastRead = Number(localStorage.getItem(adminChatReadKey) || 0);
        if ((m.pollId || "qa") === "qa" && !chatView && m.ts > lastRead) { unreadChat++; chatBadge.textContent = unreadChat; chatBadge.hidden = false; }
      },
      onReact: ({ id, reactions }) => { const m = msgs.get(id); if (m) { m.reactions = reactions; renderMessages(); } },
      onDel: ({ id }) => { const m = msgs.get(id); if (m) m.deleted = true; renderMessages(); },
      onRestore: ({ id }) => { const m = msgs.get(id); if (m) m.deleted = false; renderMessages(); },
      onPin: ({ id, on }) => { const m = msgs.get(id); if (m) { m.pinned = on; renderMessages(); } },
      onVote: ({ poll, counts }) => {
        const p = polls.get(poll); if (p) p.counts = counts;
        const w = pollsEl.querySelector(`.poll[data-poll="${poll}"]`);
        if (w) updatePoll(w, counts);
      },
      onStage: (s) => { stage = { focus: s.focus, sort: s.sort }; renderStageBar(); renderPolls(); renderMessages(); },
      onPolls: (items) => {
        const prev = new Map(polls); polls.clear();
        pollOrder = items.map((p) => { const old = prev.get(p.id); polls.set(p.id, { ...p, counts: p.counts ?? old?.counts }); return p.id; });
        renderStageBar(); renderPolls();
      },
    });

    let adminMeta = null;
    async function loadAdminMessages() {
      if (!key) return;
      const r = await fetch(`/admin/${encodeURIComponent(code)}/messages?key=${encodeURIComponent(key)}`);
      if (!r.ok) return;
      const data = await r.json();
      adminMeta = data.meta || null;
      data.messages.forEach((m) => msgs.set(m.id, m));
      renderMessages();
    }
    loadAdminMessages();

    // Export: full record (metadata + polls + chat, including archived) as .txt.
    function exportTxt() {
      const out = [];
      const line = (m) => {
        const when = new Date(m.ts).toLocaleString();
        return `  - ${m.text}  [👍 ${m.reactions || 0}]${m.pinned ? " (pinned)" : ""}${m.deleted ? " (archived)" : ""}  — ${when}`;
      };
      const byTime = (a, b) => a.ts - b.ts;

      out.push(`QR Poll — Event Export`);
      out.push(`Title: ${document.getElementById("title").textContent.trim()}`);
      out.push(`Event code: ${code}`);
      if (adminMeta?.presenterEmail) out.push(`Presenter email: ${adminMeta.presenterEmail}`);
      if (key) out.push(`Admin key: ${key}   (keep private)`);
      out.push(`Audience URL: ${location.origin}/r/${code}`);
      out.push(`Exported: ${new Date().toLocaleString()}`);
      out.push("");

      for (const id of pollOrder) {
        const p = polls.get(id);
        if (!p) continue;
        out.push(`## Poll: ${p.q}  [${p.type}]`);
        if (p.type === "choice") {
          const counts = p.counts || [];
          const total = counts.reduce((a, b) => a + b, 0);
          p.options.forEach((o, i) => {
            const c = counts[i] || 0;
            out.push(`  - ${o}: ${c} (${total ? Math.round((c / total) * 100) : 0}%)`);
          });
          out.push(`  Total votes: ${total}`);
        } else {
          [...msgs.values()].filter((m) => m.pollId === id).sort(byTime).forEach((m) => out.push(line(m)));
        }
        out.push("");
      }

      const chat = [...msgs.values()].filter((m) => (m.pollId || "qa") === "qa").sort(byTime);
      const archivedCount = chat.filter((m) => m.deleted).length;
      out.push(`## Chat Room  (${chat.length} total, ${archivedCount} archived)`);
      chat.forEach((m) => out.push(line(m)));

      const blob = new Blob([out.join("\n")], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `qr-poll-${code}.txt`;
      a.click();
      URL.revokeObjectURL(a.href);
    }
    document.getElementById("exportBtn").addEventListener("click", (e) => { e.preventDefault(); exportTxt(); });
  </script>
</body>
</html>
