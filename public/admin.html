<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Chat · 관리자</title>
  <link rel="stylesheet" href="/style.css?v=4" />
</head>
<body>
  <div class="wrap admin">
    <header>
      <h1 id="title">…</h1>
      <div class="code">관리자 콘솔 · 코드 <b id="code"></b>
        · <a id="present" target="_blank" rel="noopener">🖥️ 빔프로젝터 창 열기</a>
        · <a id="joinlink" target="_blank" rel="noopener">참가 링크</a>
      </div>
      <p id="warn" class="err"></p>
    </header>

    <section class="panel">
      <div class="panel-title">지금 프로젝터에 띄운 것</div>
      <div id="stagebar" class="stagebar"></div>
      <div class="stage-nav">
        <button id="prev" type="button">◀ 이전</button>
        <button id="next" type="button">다음 ▶</button>
        <span class="spacer"></span>
        <button id="sort" type="button" class="sortbtn">최신순</button>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">투표 (질문)</div>
      <form id="pollform" class="pollform">
        <input id="pollid" placeholder="id (예: check-in)" pattern="[A-Za-z0-9_-]{2,49}" required />
        <input id="pollq" placeholder="질문" required />
        <select id="polltype"><option value="choice">객관식</option><option value="text">텍스트 응답</option></select>
        <input id="polloptions" placeholder="선택지 (쉼표로 구분)" />
        <button type="submit">poll 추가</button>
      </form>
      <div id="polls"></div>
    </section>

    <section class="panel">
      <div class="panel-title">메시지 <span id="mcount" class="count"></span></div>
      <ul id="feed" class="adminfeed"></ul>
    </section>
  </div>

  <script type="module">
    import { connect, renderPoll, updatePoll, sortMessages, adminAction } from "/app.js?v=5";
    const parts = location.pathname.split("/");
    const code = parts.pop();
    const key = new URLSearchParams(location.search).get("key") || "";

    document.getElementById("code").textContent = code;
    document.getElementById("present").href = `/present/${code}`;
    document.getElementById("joinlink").href = `/r/${code}`;
    if (!key) document.getElementById("warn").textContent =
      "⚠️ 관리자 키가 URL에 없습니다. 제어(삭제·질문 띄우기)가 동작하지 않아요.";

    const feed = document.getElementById("feed");
    const pollsEl = document.getElementById("polls");
    const stagebar = document.getElementById("stagebar");
    const msgs = new Map();
    const polls = new Map();
    let pollOrder = [];        // poll id 순서
    let stage = { focus: "qa", sort: "recent" };

    const stages = () => ["qa", ...pollOrder];
    const label = (f) => (f === "qa" || f === "wall" ? "🙋 청중 Q&A" : (polls.get(f)?.q || f));

    async function setStage(focus, sort = (focus === "qa" ? stage.sort : (polls.get(focus)?.sort || "recent"))) {
      if (!key) return;
      const r = await adminAction(code, key, "stage", { focus, sort });
      if (!r) document.getElementById("warn").textContent = "관리자 키가 올바르지 않습니다.";
      // 서버가 SSE로 stage를 되쏘므로 별도 렌더 불필요
    }

    function renderStageBar() {
      stagebar.replaceChildren(...stages().map((f) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip" + (f === stage.focus ? " active" : "");
        b.textContent = label(f);
        b.onclick = () => setStage(f);
        return b;
      }));
      document.getElementById("sort").textContent = stage.sort === "top" ? "인기순 👍" : "최신순";
    }

    function msgRow(m) {
      const li = document.createElement("li");
      li.dataset.id = m.id;
      if (m.pinned) li.classList.add("pinned");
      const txt = document.createElement("span");
      txt.className = "txt";
      txt.textContent = m.text;
      const meta = document.createElement("span");
      meta.className = "rowmeta";
      const cnt = document.createElement("span"); cnt.className = "cnt"; cnt.textContent = `👍 ${m.reactions || 0}`;
      const pin = document.createElement("button"); pin.type = "button"; pin.className = "mini";
      pin.textContent = m.pinned ? "고정해제" : "고정";
      pin.onclick = () => adminAction(code, key, `pin/${m.id}`, { on: !m.pinned });
      const del = document.createElement("button"); del.type = "button"; del.className = "mini danger";
      del.textContent = "삭제";
      del.onclick = () => { if (confirm("이 메시지를 숨길까요?")) adminAction(code, key, `delete/${m.id}`); };
      meta.append(cnt, pin, del);
      li.append(txt, meta);
      return li;
    }

    function renderMessages() {
      const pollId = stage.focus === "wall" ? "qa" : stage.focus;
      const arr = sortMessages([...msgs.values()].filter((m) => (m.pollId || "qa") === pollId), stage.sort);
      feed.replaceChildren(...arr.map(msgRow));
      document.getElementById("mcount").textContent = `(${msgs.size})`;
    }

    function renderPolls() {
      pollsEl.replaceChildren(...pollOrder.map((id) => {
        const p = polls.get(id);
        const box = document.createElement("div");
        box.className = "pollwrap";
        box.append(renderPoll(code, polls.get(id), false));
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "ghost small";
        btn.textContent = stage.focus === id ? "지금 띄우는 중" : "이 질문 띄우기";
        btn.disabled = stage.focus === id;
        btn.onclick = () => setStage(id);
        box.append(btn);
        const controls = document.createElement("div"); controls.className = "poll-controls";
        for (const [direction, text] of [["up", "▲"], ["down", "▼"]]) {
          const move = document.createElement("button"); move.type = "button"; move.className = "mini"; move.textContent = text;
          move.title = direction === "up" ? "위로" : "아래로";
          move.onclick = async () => { await adminAction(code, key, `poll/${id}/move/${direction}`); };
          controls.append(move);
        }
        const edit = document.createElement("button"); edit.type = "button"; edit.className = "mini"; edit.textContent = "편집";
        edit.onclick = async () => {
          const p = polls.get(id); const q = prompt("질문", p.q); if (q === null) return;
          const options = p.type === "choice" ? prompt("선택지 (쉼표로 구분)", p.options.join(",")) : "";
          if (options === null) return;
          await adminAction(code, key, `poll/${id}/update`, { id, type: p.type, q, options: options.split(",") });
        };
        const del = document.createElement("button"); del.type = "button"; del.className = "mini danger"; del.textContent = "삭제";
        del.onclick = async () => { if (confirm("이 poll을 삭제할까요?")) await adminAction(code, key, `poll/${id}/delete`); };
        const sort = document.createElement("button"); sort.type = "button"; sort.className = "mini"; sort.textContent = p.sort === "top" ? "인기순" : "최신순";
        sort.onclick = () => adminAction(code, key, "stage", { focus: id, sort: p.sort === "top" ? "recent" : "top" });
        controls.append(edit, del, sort); box.append(controls);
        return box;
      }));
    }

    document.getElementById("pollform").onsubmit = async (e) => {
      e.preventDefault();
      const type = document.getElementById("polltype").value;
      const options = document.getElementById("polloptions").value.split(",").map((x) => x.trim()).filter(Boolean);
      await adminAction(code, key, "poll/create", { id: document.getElementById("pollid").value.trim(), type, q: document.getElementById("pollq").value.trim(), options });
      e.target.reset();
    };

    document.getElementById("sort").onclick = () =>
      setStage(stage.focus, stage.sort === "top" ? "recent" : "top");
    const step = (d) => {
      const s = stages(); const i = s.indexOf(stage.focus);
      setStage(s[(i + d + s.length) % s.length]);
    };
    document.getElementById("prev").onclick = () => step(-1);
    document.getElementById("next").onclick = () => step(1);

    connect(code, {
      onMeta: (d) => {
        document.getElementById("title").textContent = d.title;
        pollOrder = (d.polls || []).map((p) => (polls.set(p.id, p), p.id));
        if (d.stage) stage = d.stage;
        renderStageBar(); renderPolls(); renderMessages();
      },
      onMsg: (m) => { msgs.set(m.id, { reactions: 0, pinned: false, ...m }); renderMessages(); },
      onReact: ({ id, reactions }) => { const m = msgs.get(id); if (m) { m.reactions = reactions; renderMessages(); } },
      onDel: ({ id }) => { msgs.delete(id); renderMessages(); },
      onPin: ({ id, on }) => { const m = msgs.get(id); if (m) { m.pinned = on; renderMessages(); } },
      onVote: ({ poll, counts }) => {
        const p = polls.get(poll); if (p) p.counts = counts;
        const w = pollsEl.querySelector(`.poll[data-poll="${poll}"]`);
        if (w) updatePoll(w, counts);
      },
      onStage: (s) => { stage = { focus: s.focus, sort: s.sort }; renderStageBar(); renderPolls(); renderMessages(); },
      onPolls: (items) => { polls.clear(); pollOrder = items.map((p) => (polls.set(p.id, p), p.id)); renderStageBar(); renderPolls(); },
    });
  </script>
</body>
</html>
