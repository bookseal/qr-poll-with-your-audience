<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Poll</title>
  <link rel="stylesheet" href="/style.css?v=12" />
</head>
<body>
  <div class="center">
    <div class="card">
      <h1>💬 QR Poll</h1>

      <p class="count">🙋 <b>Audience</b> — join with an event code</p>
      <form id="joinForm">
        <input id="code" inputmode="numeric" placeholder="e.g. 9587463" required autofocus />
        <button>Join event</button>
      </form>

      <div class="or">or</div>

      <p class="count">🔐 <b>Presenter</b> — temporary access</p>
      <form id="accessForm">
        <input id="accessEmail" type="email" placeholder="Presenter email" required />
        <button class="ghost">Email me a sign-in link</button>
      </form>
      <div id="sessions" class="sessions" hidden></div>

      <div class="or">or create a new event</div>

      <p class="count">🎤 <b>Presenter</b> — create a new event</p>
      <form id="newForm">
        <input id="title" maxlength="80" placeholder="Event title (e.g. Product workshop)" required />
        <input id="presenterEmail" type="email" placeholder="Presenter email" required />
        <button class="ghost">Create event →</button>
      </form>
      <p id="err" class="err"></p>
      <p class="hint-sm">Enter the presenter email you used — we'll email you a one-time sign-in link (valid 15 minutes).</p>
    </div>
    <a class="report-link" href="/report/">📄 이 서비스를 AI로 어떻게 만들었나 — 빌드 리포트 →</a>
  </div>

  <script type="module">
    document.getElementById("joinForm").addEventListener("submit", (e) => {
      e.preventDefault();
      location.href = "/r/" + encodeURIComponent(code.value.trim());
    });

    const err = document.getElementById("err");
    document.getElementById("accessForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = "";
      const btn = e.target.querySelector("button"); btn.disabled = true;
      const box = document.getElementById("sessions");
      box.hidden = true; box.replaceChildren();
      try {
        const r = await fetch("/presenter/login", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ presenterEmail: accessEmail.value.trim() }),
        });
        const d = await r.json();
        btn.disabled = false;
        if (!r.ok) { err.textContent = d.error || "Could not send the sign-in link."; return; }
        const note = document.createElement("p");
        note.className = "sent-note";
        note.textContent = "📧 Check your inbox — we sent a sign-in link (valid 15 minutes).";
        box.append(note);
        box.hidden = false;
      } catch { err.textContent = "Network error."; btn.disabled = false; }
    });

    document.getElementById("newForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = "";
      const btn = e.target.querySelector("button");
      btn.disabled = true;
      try {
        const r = await fetch("/new", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title: title.value.trim(), presenterEmail: presenterEmail.value.trim() }),
        });
        const d = await r.json();
        if (!r.ok) { err.textContent = d.error || "Could not create event."; btn.disabled = false; return; }
        // 관리자 콘솔로 이동 (비밀키 포함). 이 URL을 잃어버리면 제어 못 하니 북마크 권장.
        location.href = `/admin/${d.code}?key=${d.key}`;
      } catch {
        err.textContent = "Network error."; btn.disabled = false;
      }
    });
  </script>
</body>
</html>
