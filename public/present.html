<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Chat · 발표자</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="present">
    <aside class="qr">
      <img id="qr" alt="QR" style="width:100%" />
      <div class="big" id="code"></div>
      <div class="hint">폰으로 QR을 찍어 익명 참여</div>
    </aside>
    <main>
      <header>
        <h1 id="title">…</h1>
        <div class="count"><span id="n">0</span> messages ·
          <button id="sort" type="button" class="sortbtn">최신순</button>
        </div>
      </header>
      <ul id="feed"></ul>
    </main>
  </div>

  <script type="module">
    import { connect, buildLi } from "/app.js";
    const code = location.pathname.split("/").pop();
    const feed = document.getElementById("feed");
    document.getElementById("code").textContent = code;
    document.getElementById("qr").src = `/qr/${encodeURIComponent(code)}.svg`;

    const msgs = new Map(); // id -> {id,text,ts,reactions}
    let sort = "recent";    // recent | top

    function render() {
      const arr = [...msgs.values()].sort(
        sort === "top"
          ? (a, b) => b.reactions - a.reactions || b.ts - a.ts
          : (a, b) => b.ts - a.ts
      );
      feed.replaceChildren(...arr.map((m) => buildLi(code, m)));
      document.getElementById("n").textContent = msgs.size;
    }

    document.getElementById("sort").onclick = (e) => {
      sort = sort === "recent" ? "top" : "recent";
      e.target.textContent = sort === "recent" ? "최신순" : "인기순 👍";
      render();
    };

    connect(code, {
      onMeta: (d) => (document.getElementById("title").textContent = d.title),
      onMsg: (m) => { msgs.set(m.id, { ...m, reactions: m.reactions || 0 }); render(); },
      onReact: ({ id, reactions }) => {
        const m = msgs.get(id);
        if (m) { m.reactions = reactions; render(); }
      },
    });
  </script>
</body>
</html>
