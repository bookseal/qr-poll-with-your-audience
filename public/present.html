<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Poll · Projector</title>
  <link rel="stylesheet" href="/style.css?v=12" />
</head>
<body>
  <div class="present">
    <aside class="qr">
      <img id="qr" alt="QR" style="width:100%" />
      <div class="big" id="code"></div>
      <div class="hint">Scan the QR code<br />to join anonymously</div>
    </aside>
    <main>
      <header>
        <h1 id="title">…</h1>
        <div class="count" id="sub"></div>
      </header>
      <div id="pollbox"></div>
      <ul id="feed"></ul>
    </main>
  </div>

  <script type="module">
    import { connect, buildLi, renderPoll, updatePoll, sortMessages } from "/app.js?v=12";
    const code = location.pathname.split("/").pop();
    const feed = document.getElementById("feed");
    const pollbox = document.getElementById("pollbox");
    const sub = document.getElementById("sub");
    document.getElementById("code").textContent = code;
    document.getElementById("qr").src = `/qr/${encodeURIComponent(code)}.svg`;

    const msgs = new Map();
    const polls = new Map();
    let stage = { focus: "qa", sort: "recent" };
    const qa = { id: "qa", q: "Chat Room", type: "text", sort: "recent" };

    function render() {
      if (stage.focus === "qa") {
        pollbox.hidden = true;
        feed.hidden = true;
        feed.replaceChildren();
        sub.textContent = "";
      } else {
        feed.hidden = true;
        pollbox.hidden = false;
        const p = polls.get(stage.focus);
        if (p) {
          pollbox.replaceChildren(renderPoll(code, p, false));
          if (p.type === "text") {
            const list = [...msgs.values()].filter((m) => m.pollId === p.id);
            feed.hidden = false;
            feed.replaceChildren(...sortMessages(list, p.sort).map((m) => buildLi(code, m)));
            sub.textContent = `${list.length} messages · ${p.sort === "top" ? "Popular" : "Recent"}`;
          } else {
            const total = (p.counts || []).reduce((a, b) => a + b, 0);
            sub.textContent = `${total} votes`;
          }
        }
      }
    }

    connect(code, {
      onMeta: (d) => {
        document.getElementById("title").textContent = d.title;
        (d.polls || []).forEach((p) => polls.set(p.id, p));
        if (d.stage) stage = d.stage;
        render();
      },
      onMsg: (m) => { msgs.set(m.id, { reactions: 0, pinned: false, pollId: "qa", ...m }); render(); },
      onReact: ({ id, reactions }) => { const m = msgs.get(id); if (m) { m.reactions = reactions; render(); } },
      onDel: ({ id }) => { msgs.delete(id); render(); },
      onPin: ({ id, on }) => { const m = msgs.get(id); if (m) { m.pinned = on; render(); } },
      onVote: ({ poll, counts }) => {
        const p = polls.get(poll); if (p) p.counts = counts;
        if (stage.focus === poll) {
          const w = pollbox.querySelector(`.poll[data-poll="${poll}"]`);
          if (w) updatePoll(w, counts);
        }
      },
      onStage: (s) => { stage = { focus: s.focus, sort: s.sort }; render(); },
      onPolls: (items) => { polls.clear(); items.forEach((p) => polls.set(p.id, p)); render(); },
    });
  </script>
</body>
</html>
