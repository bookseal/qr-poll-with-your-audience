<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Chat</title>
  <link rel="stylesheet" href="/style.css?v=2" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="title">…</h1>
      <div class="code">익명 채팅 · 코드 <span id="code"></span></div>
    </header>
    <div id="polls"></div>
    <ul id="feed"></ul>
  </div>
  <div class="composer">
    <form class="inner" id="form">
      <textarea id="text" rows="1" maxlength="500" placeholder="익명으로 남기기…" required></textarea>
      <button id="send">보내기</button>
    </form>
  </div>

  <script type="module">
    import { connect, send, buildLi, setCount, renderPoll, updatePoll } from "/app.js?v=2";
    const code = location.pathname.split("/").pop();
    const feed = document.getElementById("feed");
    const pollsEl = document.getElementById("polls");
    document.getElementById("code").textContent = code;

    connect(code, {
      onMeta: (d) => {
        document.getElementById("title").textContent = d.title;
        (d.polls || []).forEach((p) => pollsEl.append(renderPoll(code, p, true)));
      },
      onVote: ({ poll, counts }) => {
        const w = pollsEl.querySelector(`.poll[data-poll="${poll}"]`);
        if (w) updatePoll(w, counts);
      },
      onMsg: (m) => {
        const atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 60;
        const li = buildLi(code, m);
        feed.append(li);
        if (atBottom) li.scrollIntoView({ behavior: "smooth" });
      },
      onReact: ({ id, reactions }) => setCount(feed, id, reactions),
    });

    const form = document.getElementById("form");
    const text = document.getElementById("text");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const v = text.value.trim();
      if (!v) return;
      text.value = "";
      if (!(await send(code, v))) text.value = v; // 실패 시 복구
    });
    // Enter=전송, Shift+Enter=줄바꿈. 한글 IME 조합 중 Enter는 무시(조합 확정용).
    text.addEventListener("keydown", (e) => {
      if (e.isComposing || e.keyCode === 229) return; // IME 조합 중
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
    });
  </script>
</body>
</html>
