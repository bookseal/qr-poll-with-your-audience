<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Chat · Audience</title>
  <link rel="stylesheet" href="/style.css?v=4" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="title">…</h1>
      <div class="code">🙋 Audience · anonymous participation · code <span id="code"></span></div>
    </header>
    <nav id="tabs" class="tabs" aria-label="Participation type"></nav>
    <div id="pollbox"></div>
    <ul id="feed"></ul>
  </div>
  <div class="composer" id="composer">
    <form class="inner" id="form">
      <textarea id="text" rows="1" maxlength="500" placeholder="Write anonymously…" required></textarea>
      <button id="send">Send</button>
    </form>
  </div>

  <script type="module">
    import { connect, send, buildLi, setCount, renderPoll, updatePoll } from "/app.js?v=5";
    const code = location.pathname.split("/").pop();
    const feed = document.getElementById("feed");
    const pollbox = document.getElementById("pollbox");
    const composer = document.getElementById("composer");
    document.getElementById("code").textContent = code;

    const polls = new Map();
    const msgs = new Map();
    let stage = { focus: "qa", sort: "recent" };
    let active = "qa";
    const qa = { id: "qa", q: "Audience Q&A", type: "text", sort: "recent" };

    function tabs() {
      const items = [qa, ...polls.values()];
      document.getElementById("tabs").replaceChildren(...items.map((p) => {
        const b = document.createElement("button"); b.type = "button";
        b.className = "tab" + (active === p.id ? " active" : "");
        b.textContent = p.q; b.onclick = () => { if (p.id === qa.id || p.id === stage.focus) { active = p.id; applyStage(); } };
        if (p.id !== qa.id && p.id !== stage.focus) b.disabled = true;
        return b;
      }));
    }

    function applyStage() {
      const focus = stage.focus === "wall" ? "qa" : stage.focus;
      if (active !== qa.id && active !== focus) active = focus;
      const p = active === qa.id ? qa : polls.get(active);
      tabs();
      if (p) {
        const isQa = active === qa.id;
        const textMode = isQa || p.type === "text";
        feed.hidden = !textMode;
        composer.hidden = !textMode;
        pollbox.hidden = isQa;
        pollbox.replaceChildren(...(isQa ? [] : [renderPoll(code, p, true)]));
        const list = [...msgs.values()].filter((m) => m.pollId === active);
        feed.replaceChildren(...list.map((m) => buildLi(code, m)));
      } else {
        pollbox.hidden = true;
        pollbox.replaceChildren();
      }
    }

    connect(code, {
      onMeta: (d) => {
        document.getElementById("title").textContent = d.title;
        (d.polls || []).forEach((p) => polls.set(p.id, p));
        if (d.stage) stage = d.stage;
        (d.qa ? [d.qa] : []).forEach((p) => Object.assign(qa, p));
        (d.polls || []).forEach((p) => polls.set(p.id, p));
        active = stage.focus === "wall" ? qa.id : stage.focus;
        applyStage();
      },
      onMsg: (m) => {
        msgs.set(m.id, m);
        if (m.pollId === active) {
          const atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 60;
          const li = buildLi(code, m); feed.append(li);
          if (atBottom) li.scrollIntoView({ behavior: "smooth" });
        }
      },
      onReact: ({ id, reactions }) => setCount(feed, id, reactions),
      onDel: ({ id }) => { msgs.delete(id); feed.querySelector(`li[data-id="${id}"]`)?.remove(); },
      onPin: ({ id, on }) => feed.querySelector(`li[data-id="${id}"]`)?.classList.toggle("pinned", on),
      onVote: ({ poll, counts }) => {
        const p = polls.get(poll); if (p) p.counts = counts;
        if (active === poll) {
          const w = pollbox.querySelector(`.poll[data-poll="${poll}"]`);
          if (w) updatePoll(w, counts);
        }
      },
      onStage: (s) => { stage = { focus: s.focus, sort: s.sort }; applyStage(); },
      onPolls: (items) => { polls.clear(); items.forEach((p) => polls.set(p.id, p)); applyStage(); },
    });

    const form = document.getElementById("form");
    const text = document.getElementById("text");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const v = text.value.trim();
      if (!v) return;
      text.value = "";
      if (!(await send(code, v, active))) text.value = v; // restore on failure
    });
    // Enter sends, Shift+Enter adds a line break. Ignore Enter during IME composition.
    text.addEventListener("keydown", (e) => {
      if (e.isComposing || e.keyCode === 229) return; // IME 조합 중
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
    });
  </script>
</body>
</html>
