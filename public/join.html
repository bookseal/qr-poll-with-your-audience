<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Chat · 청중</title>
  <link rel="stylesheet" href="/style.css?v=4" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="title">…</h1>
      <div class="code">🙋 청중 · 익명 참여 · 코드 <span id="code"></span></div>
    </header>
    <div id="pollbox"></div>
    <ul id="feed"></ul>
  </div>
  <div class="composer" id="composer">
    <form class="inner" id="form">
      <textarea id="text" rows="1" maxlength="500" placeholder="익명으로 남기기…" required></textarea>
      <button id="send">보내기</button>
    </form>
  </div>

  <script type="module">
    import { connect, send, buildLi, setCount, renderPoll, updatePoll } from "/app.js?v=4";
    const code = location.pathname.split("/").pop();
    const feed = document.getElementById("feed");
    const pollbox = document.getElementById("pollbox");
    const composer = document.getElementById("composer");
    document.getElementById("code").textContent = code;

    const polls = new Map();
    let stage = { focus: "wall", sort: "recent" };

    // 관리자가 focus한 것만 보여준다 (Slido처럼): 메시지 월 ↔ 지금 띄운 질문
    function applyStage() {
      const p = stage.focus !== "wall" && polls.get(stage.focus);
      if (p) {
        feed.hidden = true;
        composer.hidden = true;
        pollbox.hidden = false;
        pollbox.replaceChildren(renderPoll(code, p, true)); // 투표 가능
      } else {
        pollbox.hidden = true;
        pollbox.replaceChildren();
        feed.hidden = false;
        composer.hidden = false;
      }
    }

    connect(code, {
      onMeta: (d) => {
        document.getElementById("title").textContent = d.title;
        (d.polls || []).forEach((p) => polls.set(p.id, p));
        if (d.stage) stage = d.stage;
        applyStage();
      },
      onMsg: (m) => {
        const atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 60;
        const li = buildLi(code, m);
        feed.append(li);
        if (atBottom && !feed.hidden) li.scrollIntoView({ behavior: "smooth" });
      },
      onReact: ({ id, reactions }) => setCount(feed, id, reactions),
      onDel: ({ id }) => feed.querySelector(`li[data-id="${id}"]`)?.remove(),
      onPin: ({ id, on }) => feed.querySelector(`li[data-id="${id}"]`)?.classList.toggle("pinned", on),
      onVote: ({ poll, counts }) => {
        const p = polls.get(poll); if (p) p.counts = counts;
        if (stage.focus === poll) {
          const w = pollbox.querySelector(`.poll[data-poll="${poll}"]`);
          if (w) updatePoll(w, counts);
        }
      },
      onStage: (s) => { stage = { focus: s.focus, sort: s.sort }; applyStage(); },
    });

    const form = document.getElementById("form");
    const text = document.getElementById("text");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const v = text.value.trim();
      if (!v) return;
      text.value = "";
      if (!(await send(code, v))) text.value = v; // 실패 시 복구
    });
    // Enter=전송, Shift+Enter=줄바꿈. 한글 IME 조합 중 Enter는 무시(조합 확정용).
    text.addEventListener("keydown", (e) => {
      if (e.isComposing || e.keyCode === 229) return; // IME 조합 중
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
    });
  </script>
</body>
</html>
